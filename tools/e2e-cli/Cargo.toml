[package]
name = "verdaccio-e2e-cli"
version = "2.10.2"
edition = "2021"
license = "MIT"

[[bin]]
name = "verdaccio-e2e"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
reqwest = { version = "0.12.26", features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
serde_yaml = "0.9.34"
tempfile = "3.23.0"
url = "2.5.8"

storage: /verdaccio/storage/data

plugins: /verdaccio/plugins

web:
  enable: true
  title: Verdaccio
  login: true
  # Surface the settings / translations dialog in the header so the
  # e2e-ui settings suite has something to click on.
  showSettings: true
  showInfo: true

auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd

uplinks:
  npmjs:
    url: https://registry.npmjs.org/

packages:
  '@private/*':
    access: $authenticated
    publish: $anonymous $authenticated
    unpublish: $anonymous $authenticated
  '@verdaccio/*':
    access: $all
    publish: $anonymous $authenticated
    unpublish: $anonymous $authenticated
  '@*/*':
    access: $all
    publish: $anonymous $authenticated
    unpublish: $anonymous $authenticated
    proxy: npmjs
  '**':
    access: $all
    publish: $anonymous $authenticated
    unpublish: $anonymous $authenticated
    proxy: npmjs

middlewares:
  audit:
    enabled: true

# Loosen the default rate limit on /-/verdaccio/sec/* endpoints so
# cypress runs (which log in repeatedly across specs) don't hit 429.
userRateLimit:
  windowMs: 1000
  max: 10000

# Exposes the Change Password page (/-/web/change-password) AND registers
# the server-side PUT /-/verdaccio/sec/reset_password route the
# 07-change-password spec exercises. Both keys are required because the two
# sides read different config keys:
#   - the client UI options merge `{...config.flags, ...config.experiments}`,
#     so either key makes the React page render (not redirect to `/`)
#   - the server route in @verdaccio/web gates ONLY on `config.flags`, with
#     no `experiments` fallback (packages/web/src/api/user.ts)
# The `verdaccio:6` image reads the legacy `experiments` key; nightly-master
# reads `flags`. Setting both keeps every matrix line green. Without `flags`
# the master image renders the page but 404s the PUT (`Cannot PUT
# /-/verdaccio/sec/reset_password`), which is what broke this job.
experiments:
  changePassword: true

flags:
  changePassword: true

log: { type: stdout, format: json, level: info }

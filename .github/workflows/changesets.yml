name: Changesets

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  CI: true
  PNPM_CACHE_FOLDER: .pnpm-store
  NPM_CONFIG_PROVENANCE: 'true'

jobs:
  # Open/refresh the "build: release packages" version PR from changesets.
  # Runs freely on every push to main (no environment gate, no publish).
  version:
    timeout-minutes: 14
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.repository == 'verdaccio/e2e-tests'
    outputs:
      # v2 renamed the output hasChangesets -> has-changesets
      hasChangesets: ${{ steps.changesets.outputs['has-changesets'] }}
    steps:
      - name: checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: install pnpm
        run: npm i -g corepack@latest || corepack enable && corepack prepare pnpm@latest --activate
      - name: install dependencies
        run: pnpm install
      - name: build packages
        run: pnpm build
      - name: create versions
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1
        with:
          # v2 renamed every input (version -> version-script, commit ->
          # commit-message, title -> pr-title, createGithubReleases ->
          # create-github-releases) and dropped setupGitUser. It also no
          # longer reads the GITHUB_TOKEN env var: the custom PAT (needed so
          # the release PR triggers CI) must go through the github-token input.
          github-token: ${{ secrets.CHANGESET_RELEASE_TOKEN }}
          version-script: pnpm ci:version
          commit-message: 'build: release packages'
          pr-title: 'build: release packages'
          create-github-releases: true

  # Publish to npm once the version PR has been merged (no changesets left).
  # Gated by the `npm` environment, which requires manual approval.
  publish:
    needs: version
    if: needs.version.outputs.hasChangesets == 'false'
    timeout-minutes: 14
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: install pnpm
        run: npm i -g corepack@latest || corepack enable && corepack prepare pnpm@latest --activate
      - name: install dependencies
        run: pnpm install
      - name: build packages
        run: pnpm build
      - name: publish
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1
        with:
          github-token: ${{ secrets.CHANGESET_RELEASE_TOKEN }}
          publish-script: pnpm ci:publish
          create-github-releases: true
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org

name: E2E CLI

concurrency:
  group: e2e-cli-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  e2e-cli:
    if: github.head_ref != 'changeset-release/main'
    strategy:
      fail-fast: false
      matrix:
        # next-7/next-9 are disabled: the published next binaries still carry
        # the tarball/uplink bugs this battery detects (client hang on uplink
        # drop, abbreviated metadata leaking internal fields, max_fails
        # driving got retries). Re-add them once a fixed next release ships.
        verdaccio: ['6']
        pm:
          - npm@10
          - npm@11
          - npm@12
          - pnpm@10
          - pnpm@11
          - yarn-modern@3
          - yarn-modern@4
          - bun
          - deno
    name: verdaccio@${{ matrix.verdaccio }} / ${{ matrix.pm }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
      - name: corepack
        run: corepack enable
      - name: Setup Bun
        if: startsWith(matrix.pm, 'bun')
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Setup Deno
        if: startsWith(matrix.pm, 'deno')
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Install Verdaccio
        run: npm install -g verdaccio@${{ matrix.verdaccio }}
      - name: Generate Verdaccio config
        # Shared battery config from the CLI itself: max_body_size for
        # scenario:tarballs, mock uplink (port 4874) for scenario:uplink-failure.
        run: |
          mkdir -p /tmp/verdaccio-e2e
          node tools/e2e-cli/bin/e2e-cli.js --print-config --uplink-port 4874 > /tmp/verdaccio-e2e/config.yaml
      - name: Start Verdaccio
        run: |
          cd /tmp/verdaccio-e2e
          verdaccio --config /tmp/verdaccio-e2e/config.yaml --listen 4873 &
          for i in $(seq 1 30); do
            if curl -s http://localhost:4873/-/ping; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Verdaccio failed to start after 30s"
              exit 1
            fi
            sleep 1
          done
      - name: Run E2E tests
        run: node tools/e2e-cli/bin/e2e-cli.js --registry http://localhost:4873 --pm "${{ matrix.pm }}" --uplink-port 4874 -v

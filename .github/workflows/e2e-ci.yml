name: E2E CLI

concurrency:
  group: e2e-cli-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  e2e-cli:
    if: github.head_ref != 'changeset-release/main'
    strategy:
      fail-fast: false
      matrix:
        # next-7/next-9 are disabled: the published next binaries still carry
        # the tarball/uplink bugs this battery detects (client hang on uplink
        # drop, abbreviated metadata leaking internal fields, max_fails
        # driving got retries). Re-add them once a fixed next release ships.
        # pnpr (@pnpm/pnpr@next) runs the same battery; its known-failing
        # tests are skip-listed in the run step until a release ships the
        # parity fixes, and it runs without the mock uplink (its registry
        # namespaces cannot claim the unscoped dynamic e2e-uplink-* names).
        registry: ['verdaccio@6', 'pnpr']
        pm:
          - npm@10
          - npm@11
          - npm@12
          - pnpm@10
          - pnpm@11
          - pnpm@12
          - yarn-modern@3
          - yarn-modern@4
          - bun
          - deno
    name: ${{ matrix.registry }} / ${{ matrix.pm }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
      - name: corepack
        run: corepack enable
      - name: Setup Bun
        if: startsWith(matrix.pm, 'bun')
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Setup Deno
        if: startsWith(matrix.pm, 'deno')
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Install registry
        run: |
          if [ "${{ matrix.registry }}" = "pnpr" ]; then
            npm install -g @pnpm/pnpr@next
          else
            npm install -g "${{ matrix.registry }}"
          fi
      - name: Generate registry config
        # Shared battery config from the CLI itself. verdaccio: max_body_size
        # for scenario:tarballs, mock uplink (port 4874) for
        # scenario:uplink-failure. pnpr: its own registries: shape, no uplink.
        run: |
          mkdir -p /tmp/registry-e2e
          if [ "${{ matrix.registry }}" = "pnpr" ]; then
            node tools/e2e-cli/bin/e2e-cli.js --print-config --server pnpr > /tmp/registry-e2e/config.yaml
          else
            node tools/e2e-cli/bin/e2e-cli.js --print-config --uplink-port 4874 > /tmp/registry-e2e/config.yaml
          fi
      - name: Start registry
        # pnpr rewrites dist.tarball to an explicit --public-url (verdaccio
        # derives it from the request Host header instead).
        run: |
          cd /tmp/registry-e2e
          if [ "${{ matrix.registry }}" = "pnpr" ]; then
            pnpr --config /tmp/registry-e2e/config.yaml --listen 127.0.0.1:4873 --public-url http://localhost:4873 &
          else
            verdaccio --config /tmp/registry-e2e/config.yaml --listen 4873 &
          fi
          for i in $(seq 1 30); do
            if curl -s http://localhost:4873/-/ping; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Registry failed to start after 30s"
              exit 1
            fi
            sleep 1
          done
      - name: Run E2E tests
        # The pnpr skip list mirrors PNPR_SKIP_TESTS in scripts/run-e2e.sh:
        # known gaps in the published @pnpm/pnpr, tracked in the workspace
        # audit (informe 46). Drop entries as a release ships each fix.
        run: |
          if [ "${{ matrix.registry }}" = "pnpr" ]; then
            node tools/e2e-cli/bin/e2e-cli.js --registry http://localhost:4873 --pm "${{ matrix.pm }}" -v \
              --skip-test deprecate --skip-test search --skip-test login \
              --skip-test scenario:tarballs --skip-test scenario:metadata --skip-test scenario:search
          else
            node tools/e2e-cli/bin/e2e-cli.js --registry http://localhost:4873 --pm "${{ matrix.pm }}" --uplink-port 4874 -v
          fi
